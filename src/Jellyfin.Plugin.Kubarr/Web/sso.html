<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signing in to Jellyfin</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 system-ui, sans-serif; background: #101010; color: #eee; }
  main { max-width: 28rem; padding: 2rem; text-align: center; }
  a { color: #00a4dc; }
  .error { color: #ff8a80; }
</style>
</head>
<body>
<main>
  <p id="status">Signing in with Kubarr&hellip;</p>
  <p id="fallback" hidden><a id="login" href="#">Use a Jellyfin password instead</a></p>
</main>
<script>
(async () => {
  // This page lives at <base>/Kubarr/sso; everything else is relative to <base>.
  const base = location.pathname.replace(/\/Kubarr\/sso\/?$/i, '');
  const address = location.origin + base;
  const credentialsKey = 'jellyfin_credentials';
  const status = document.getElementById('status');
  const webClient = base + '/web/index.html';
  document.getElementById('login').href = webClient + '#/login.html';

  const read = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
  };
  const credentials = read(credentialsKey, { Servers: [] });
  credentials.Servers = Array.isArray(credentials.Servers) ? credentials.Servers : [];

  // Jellyfin's web client keeps its device id under this key; share it so the
  // session we create is the one the client keeps using.
  let deviceId = localStorage.getItem('_deviceId2');
  if (!deviceId) {
    deviceId = btoa(navigator.userAgent + '|' + Date.now()).replace(/=/g, '');
    localStorage.setItem('_deviceId2', deviceId);
  }
  const current = credentials.Servers.find(s => s.ManualAddress === address && s.AccessToken);

  try {
    const response = await fetch(base + '/Kubarr/sso/session', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Kubarr-Sso': '1' },
      body: JSON.stringify({
        deviceId,
        deviceName: (navigator.userAgentData && navigator.userAgentData.platform) || 'Browser',
        appVersion: 'kubarr-sso',
        currentToken: current ? current.AccessToken : null,
      }),
    });
    if (!response.ok) {
      throw new Error(response.status === 409
        ? 'A Jellyfin account with your name is managed by another sign-in method.'
        : response.status === 401
          ? 'You are not signed in to Kubarr.'
          : 'Jellyfin could not sign you in (' + response.status + ').');
    }
    const body = await response.json();
    // Jellyfin serialises PascalCase; accept either casing.
    const pick = (name) => body[name] ?? body[name[0].toLowerCase() + name.slice(1)];
    const server = {
      Id: pick('ServerId'),
      AccessToken: pick('AccessToken'),
      UserId: pick('UserId'),
      ManualAddress: address,
      manualAddressOnly: true,
      LastConnectionMode: 2,
      DateLastAccessed: Date.now(),
    };
    credentials.Servers = credentials.Servers
      .filter(s => s.Id !== server.Id && s.ManualAddress !== address)
      .concat([server]);
    localStorage.setItem(credentialsKey, JSON.stringify(credentials));
    location.replace(webClient);
  } catch (e) {
    status.textContent = e.message;
    status.className = 'error';
    document.getElementById('fallback').hidden = false;
  }
})();
</script>
</body>
</html>
